<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#153d2d">
    <title>Reset password — Moringa Grove</title>
    <link rel="icon" type="image/png" href="/moringa-mark.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/admin.css">
    <script src="/admin/reset-password.js" defer></script>
    <script src="/translator.js" defer></script>
  </head>
  <body>
    <header class="admin-header">
      <a class="brand" href="/" aria-label="Moringa Grove homepage">
        <span class="brand-mark" aria-hidden="true"><img src="/moringa-mark.png" alt=""></span>
        <span><strong>Moringa Grove</strong><small>ADMIN PASSWORD RESET</small></span>
      </a>
      <a class="back-link" href="/admin">Sign in</a>
    </header>
    <main class="admin-main">
      <section class="login-panel reset-panel" aria-labelledby="reset-heading">
        <span class="eyebrow">Secure access</span>
        <h1 id="reset-heading">Choose a new password</h1>
        <p class="reset-description">Use at least 12 characters. This reset link can only be used once.</p>
        <form id="reset-form">
          <label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
          <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
          <button class="save-button" type="submit">Reset password <span>↗</span></button>
        </form>
        <p class="status" id="reset-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
